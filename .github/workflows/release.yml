name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New version name (e.g. 1.2.3) — release tag will be created as v<version>'
        required: true
        type: string

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Validate version_name input
      run: |
        VERSION_NAME="${{ inputs.version_name }}"
        RESERVED_NAMES="main master develop dev release"
        for reserved in $RESERVED_NAMES; do
          if [ "$VERSION_NAME" = "$reserved" ]; then
            echo "::error::version_name '${VERSION_NAME}' is a reserved branch name and cannot be used as a version/tag."
            exit 1
          fi
        done
        if ! echo "$VERSION_NAME" | grep -qE '^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
          echo "::error::version_name '${VERSION_NAME}' is invalid. Use a semver-like format such as '1.2.3'."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Decode keystore and create properties
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # Skip if keystore secret is not set (e.g. running on fork without secrets)
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "No KEYSTORE_BASE64 secret found, skipping signing config."
          exit 0
        fi
        mkdir -p android/app/keystore
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/key.jks
        cat > android/key.properties <<EOF
        storeFile=keystore/key.jks
        storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
        keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
        keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
        EOF

    - name: Update version in pubspec.yaml
      run: |
        VERSION_NAME="${{ inputs.version_name }}"
        PUBSPEC="pubspec.yaml"
        
        CURRENT_CODE=$(grep -E "^version: [0-9\.]+\+([0-9]+)" "$PUBSPEC" | sed -E "s/.*\\+([0-9]+)/\1/")
        NEXT_CODE=$((CURRENT_CODE + 1))
        
        # Replace version: 1.0.0+1 with version: 1.2.3+2
        sed -i -E "s/^version: [0-9\.]+\+[0-9]+/version: ${VERSION_NAME}+${NEXT_CODE}/" "$PUBSPEC"

    - name: Build Release APK
      run: flutter build apk --release

    - name: Commit version updates
      id: version_commit
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        if git diff --quiet -- pubspec.yaml; then
          echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add pubspec.yaml
        git commit -m "chore(release): set version to ${{ inputs.version_name }} and bump build number"
        for attempt in 1 2 3; do
          if git push origin "HEAD:refs/heads/$BRANCH_NAME"; then break; fi
          git pull --rebase origin "refs/heads/$BRANCH_NAME"
          sleep 2
        done
        echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Find previous successful release workflow run
      id: previous_success
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const runs = await github.rest.actions.listWorkflowRuns({
            owner, repo, workflow_id: "release.yml", status: "success", per_page: 1
          });
          const previous = runs.data.workflow_runs.find(run => run.id !== context.runId);
          core.setOutput("sha", previous ? previous.head_sha : "");

    - name: Generate Changelog
      id: changelog
      run: |
        PREV_SHA="${{ steps.previous_success.outputs.sha }}"
        CURR_SHA="${{ steps.version_commit.outputs.commit_sha }}"
        if [ -n "$PREV_SHA" ]; then git fetch origin "$PREV_SHA" 2>/dev/null || true; fi
        if [ -n "$PREV_SHA" ] && git cat-file -e "$PREV_SHA" 2>/dev/null; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_SHA..$CURR_SHA" --no-merges --invert-grep --grep='^chore(release): set version to ')
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -n 20)
        fi
        if [ -z "$CHANGELOG" ]; then CHANGELOG="- No changes since last release"; fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Collect Release APKs
      run: |
        mkdir -p release
        shopt -s nullglob
        APK_FILES=(build/app/outputs/flutter-apk/app-release.apk)
        for apk in "${APK_FILES[@]}"; do
          target="release/Expensio-v${{ inputs.version_name }}.apk"
          cp "$apk" "$target"
        done

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ inputs.version_name }}"
        NOTES_FILE="release_notes.md"
        cat > "$NOTES_FILE" <<EOF
        ## Expensio v${{ inputs.version_name }}

        ### Changelog
        ${{ steps.changelog.outputs.changelog }}
        EOF
        gh release create "$TAG" release/*.apk --title "$TAG" --target "${{ steps.version_commit.outputs.commit_sha }}" --notes-file "$NOTES_FILE"
