name: Preview Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build debug APK
    if: github.actor == github.repository_owner || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APKs
        run: |
          flutter build apk --debug
          flutter build apk --debug --split-per-abi

      - name: Collect APKs and compute checksums
        id: apk
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/ ' '__')
          mkdir -p apks_to_upload
          
          echo "**Preview build of \`${GITHUB_REF_NAME}\`**" > "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          for APK in build/app/outputs/flutter-apk/*.apk; do
            [ -e "$APK" ] || continue
            BASENAME=$(basename "$APK")
            ARCH=$(echo "$BASENAME" | sed 's/app-//' | sed 's/-debug\.apk//' | sed 's/\.apk//')
            if [ -z "$ARCH" ]; then
              ARCH="universal"
            fi
            
            DEST="apks_to_upload/Expensio-${ARCH}-debug-${SAFE_REF}-${SHORT_SHA}.apk"
            cp "$APK" "$DEST"
            
            SHA256=$(sha256sum "$DEST" | awk '{print $1}')
            SIZE=$(du -h "$DEST" | cut -f1)
            
            DEST_BASENAME=$(basename "$DEST")
            echo "| \`${DEST_BASENAME}\` | ${SIZE} | \`${SHA256}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "artifact_name=Expensio-Preview-${SAFE_REF}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload APKs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: apks_to_upload/*.apk
          if-no-files-found: error
          retention-days: 30
